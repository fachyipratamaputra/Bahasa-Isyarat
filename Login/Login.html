<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignBridge - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="Login.css" />
</head>
<body>

    <main class="page">
        <div class="login-card">

            <!-- Kiri: logo + tombol kembali -->
            <section class="left">
                <div class="logo-wrap">
                    <img src="../dokumentasi/foto/Logo_SignBridge_dengan_Ikon_Tangan_Ungu-removebg-preview.png" alt="SignBridge" />
                </div>
                <a href="../index.html" class="btn-pill">Back</a>
            </section>
    

            <div class="divider"></div>

            <!-- Kanan: form -->
            <section class="right">
                <h1>Sign In</h1>
                <p class="signup">Tidak punya akun? <a href="../login2/login2.html">Daftar</a></p>
                

                <div class="social">
                    <button type="button" class="social-btn" data-provider="Google" aria-label="Masuk dengan Google">
                        <svg viewBox="0 0 48 48" width="26" height="26"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
                    </button>
                    <button type="button" class="social-btn" data-provider="Apple" aria-label="Masuk dengan Apple">
                        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#000" d="M16.4 12.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.200.8 1.300 0 2.100-1.200 2.900-2.400.9-1.400 1.300-2.700 1.300-2.800 0 0-2.400-.9-2.400-3.800zM14 5.400c.7-.8 1.100-1.900 1-3-1 0-2.100.7-2.800 1.500-.6.700-1.200 1.800-1 2.900 1.100.100 2.100-.600 2.800-1.400z"/></svg>
                    </button>
                    <button type="button" class="social-btn" data-provider="Facebook" aria-label="Masuk dengan Facebook">
                        <svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path fill="#fff" d="M15.4 15.3l.5-3.300h-3.100v-2.100c0-.9.4-1.800 1.900-1.800h1.400V5.200s-1.300-.2-2.500-.2c-2.600 0-4.200 1.500-4.200 4.300v2.700H6.600v3.300h2.800V23h3.400v-7.700h2.600z"/></svg>
                    </button>
                </div>

                <form id="loginForm" novalidate>
                    <label class="field">
                        <span class="field-label">Email</span>
                        <input type="email" id="email" placeholder="yourmail@gmail.com" autocomplete="email" />
                    </label>

                    <label class="field">
                        <span class="field-label">Password</span>
                        <input type="password" id="password" placeholder="***********" autocomplete="current-password" />
                    </label>

                    <div class="row">
                        <label class="remember">
                            <input type="checkbox" id="remember" />
                            <span class="box"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot" id="forgotLink">Forgot Password?</a>
                    </div>

                    <p class="message" id="message" role="alert"></p>

                    <button type="submit" class="btn-pill btn-submit">Sign In</button>
                </form>
            </section>

        </div>
    </main>

    <script src="Login.js"></script>
</body>
</html>
